<style>
body{margin:0;background:#FFFFFF}
a{color:#6C3CF5}a:hover{color:#5223D6}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.cn-row{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 18px 10px 12px;border-radius:20px;background:#FFFFFF;border:1px solid #E7E4F0;text-decoration:none;color:#1B1B21;box-shadow:0 1px 2px rgba(27,27,33,.04),0 10px 24px -18px rgba(48,20,120,.35);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.cn-row:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 40%,#E7E4F0);box-shadow:0 16px 30px -18px color-mix(in srgb,var(--c) 70%,transparent);color:#1B1B21}
.cn-row:focus-visible{outline:3px solid #6C3CF5;outline-offset:2px}
.cn-ic{flex:none;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--c);background:color-mix(in srgb,var(--c) 11%,#FFFFFF)}
.cn-t{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.cn-t b{font-size:16px;font-weight:700}
.cn-t span{font-size:13px;color:#5D5E68;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cn-row>.ms{color:#8F909A}

/* ---------- Responsive layer (tablet + mobile) ---------- */
img{max-width:100%}
.hide-sm{display:inline}
.show-sm{display:none}
.nav-ic{display:none}
/* 3D wallet overlay */
html.wallet-open{overflow:hidden}
.wallet-dialog{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#E4DFD7;overflow:hidden}
.wallet-dialog[open]{animation:wallet-in .35s ease both}
.wallet-dialog::backdrop{background:rgba(20,14,40,.5)}
@keyframes wallet-in{from{opacity:0}}
.wallet-dialog iframe{display:block;width:100%;height:100%;border:0}
.wallet-close{position:absolute;top:18px;left:24px;z-index:2;height:44px;padding:0 16px 0 12px;border-radius:999px;border:1px solid rgba(29,26,22,.22);background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#1D1A16;font:600 14px/1 'Plus Jakarta Sans',system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.wallet-close:hover{background:rgba(255,255,255,.9)}
.wallet-close:focus-visible{outline:3px solid #6C3CF5;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.wallet-dialog[open]{animation:none}}
/* Tablet */
@media (max-width: 1023px){
  header>div{gap:8px !important}
  .glass-bar[style*="justify-content: space-between"]{gap:8px !important}
  #work a.m3-card[style*="flex-wrap"]>div{padding:28px !important}
}
@media (min-width: 900px){
  #highlights-grid{grid-template-columns:repeat(4,minmax(0,1fr)) !important}
}
@media (min-width: 600px) and (max-width: 899px){
  #highlights-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
}
@media (max-width: 1199px){
  #work>a.m3-card{flex-direction:column !important}
  #work>a.m3-card[style*="wrap-reverse"]{flex-direction:column-reverse !important}
  #work>a.m3-card>img{flex:none !important;width:100% !important}
  #work>a.m3-card>div{flex:none !important}
}
@media (max-width: 900px){
  header .glass-bar>a:first-child>span>span:last-child{display:none}
  header nav a{padding:0 12px !important}
}
@media (min-width: 640px) and (max-width: 1023px){
  #work>div[style*="grid-template-columns"]>a:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row !important}
  #work>div[style*="grid-template-columns"]>a:last-child:nth-child(odd)>img{width:50% !important;aspect-ratio:auto !important;min-height:100%}
}
/* Phone */
@media (max-width: 760px){
  header{padding:10px 12px 0 !important}

  header nav .nav-tx{display:none}
  header nav a.m3-filled{height:44px !important;padding:0 16px 0 12px !important;font-size:14px !important;margin-left:4px}
  .show-sm{display:inline !important}
  /* Hero buttons side by side */
  .hero-actions{flex-wrap:nowrap !important;gap:8px !important;width:100%}

  .hero-actions .hero-btn .ms{font-size:20px}
  .intro-box{padding:10px;border-radius:18px}
  .intro-head h2{font-size:16px !important;line-height:1.3}
  .hide-sm{display:none}
  .purse-btn{width:52px !important;height:52px !important}
  .purse-btn svg{width:32px;height:32px}
  header>div{gap:8px !important}
  .wallet-close{top:14px;left:14px}
  main{padding:0 18px !important}
  h1{font-size:clamp(32px,9vw,40px) !important;line-height:1.1 !important}
  h2{font-size:clamp(26px,7.4vw,30px) !important}
  p{overflow-wrap:break-word}
  #contact{padding:36px 22px !important;border-radius:24px !important}
  #contact h2{font-size:30px !important}
  #work a.m3-card>div{padding:22px !important}
  #work a.m3-card h3{font-size:22px !important}
  #highlights-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:12px !important}
  #highlights-grid>div{padding:18px !important;border-radius:20px !important}
  #highlights-grid span[style*="font-size: 56px"]{font-size:40px !important}
  #highlights-grid span[style*="font-size: 40px"]{font-size:28px !important}
  #highlights-grid h3{font-size:15px !important;width:auto !important}
  div:has(>.glow[style*="padding: 18px 20px"]){grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
  .glow[style*="padding: 18px 20px"]{padding:14px !important}
  /* Testimonials become a swipeable row */
  .testi-marquee{overflow-x:auto !important;scroll-snap-type:x mandatory;-webkit-mask-image:none !important;mask-image:none !important;margin:0 -18px;padding:6px 18px 14px !important;scrollbar-width:none}
  .testi-marquee::-webkit-scrollbar{display:none}
  .testi-track{animation:none !important;width:auto !important}
  .testi-set[aria-hidden]{display:none !important}
  .testi-set{gap:14px !important}
  .testi-card{width:82vw !important;scroll-snap-align:center;padding:22px !important}
  .testi-card figcaption{flex-wrap:wrap}
  .testi-card figcaption>.ms{display:none}
  .testi-card blockquote{font-size:15px !important}
  .hub2{height:38px;font-size:14px;padding:0 14px 0 10px}
  .hub2 .ms{font-size:18px}
  .node-icon{width:40px;height:40px}
  .node-icon img{width:22px;height:22px}
  .node-icon .ms{font-size:22px}
  footer{flex-direction:column;align-items:flex-start !important}
}
@media (max-width: 440px){
  header .rs-tx{display:none}
  header nav a.m3-filled{width:44px;padding:0 !important;justify-content:center;border-radius:50% !important;gap:0 !important}
  .wallet-close-tx{display:none}
  .wallet-close{width:44px;padding:0;justify-content:center}

@media (max-width: 360px){
  header nav a.m3-btn:not(.m3-filled){width:40px;height:40px !important}
  header nav a.m3-filled{padding:0 12px 0 10px !important;font-size:13px !important}
  .hero-actions .hero-btn{font-size:14px !important;padding:0 8px !important}
  .hub2{height:32px;font-size:12px;padding:0 10px 0 8px;gap:6px}
  #highlights-grid h3{font-size:14px !important}
}
</style>
